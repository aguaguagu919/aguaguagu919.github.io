<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .tab.active {
            display: block;
        }

        .tab {
            display: none;
        }

        .button-container {
            font-size: 20px;
            width: 120px;
            height: 40px;
            text-align: center;
            margin-bottom: 50px;
            border-radius: 10px;
            background-color: rgb(186, 163, 232);
            transition: background-color 0.5s;
            cursor: pointer;
            border: none;
        }

        .button-container:hover {
            background-color: rgb(215, 203, 239);
        }

        nav {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 40px;
            max-width: 30ch;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: rgb(144, 177, 255);
        }

        #anime-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .anime-card {
            display: flex;
            align-items: center;
            gap: 15px;
            background-color: rgb(186, 163, 232);
            border-radius: 12px;
            padding: 10px;
            width: 400px;
        }

        .anime-card img {
            width: 60px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
        }

        .anime-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .anime-title {
            font-size: 16px;
            font-weight: bold;
        }

        .anime-score {
            font-size: 14px;
            color: #444;
        }

        #loading {
            font-size: 20px;
            margin-top: 20px;
        }

        #refresh-btn {
            font-size: 16px;
            padding: 10px 24px;
            border-radius: 10px;
            background-color: rgb(186, 163, 232);
            border: none;
            cursor: pointer;
            transition: background-color 0.5s;
            margin-top: 20px;
        }

        #refresh-btn:hover {
            background-color: rgb(215, 203, 239);
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <button class="button-container" data-target="tab1">Я</button>
            <button class="button-container" data-target="tab2">О мне</button>
            <button class="button-container" data-target="tab3">Что то</button>
        </nav>
    </header>

    <div class="tabs-container">
        <div id="tab1" class="tab active">
            <div class="cell">
                <h2>Меня зовут Руслан, я студент второго курса информационных технологий</h2>
            </div>
        </div>

        <div id="tab2" class="tab">
            <div class="cell">
                <h2>Я учусь в колледже ItHub</h2>
            </div>
        </div>

        <div id="tab3" class="tab">
            <div class="cell">
                <h2>Топ аниме</h2>
                <span id="loading">Загрузка...</span>
                <div id="anime-list"></div>
                <button id="refresh-btn">Обновить 🔄</button>
            </div>
        </div>
    </div>

    <script>
        async function fetchAnime() {
            const loading = document.getElementById('loading');
            const list = document.getElementById('anime-list');

            loading.style.display = 'block';
            list.innerHTML = '';

            try {
                const response = await fetch('https://api.jikan.moe/v4/top/anime?limit=5');
                const data = await response.json();

                loading.style.display = 'none';

                data.data.forEach(anime => {
                    const card = document.createElement('div');
                    card.className = 'anime-card';
                    card.innerHTML = `
                        <img src="${anime.images.jpg.image_url}" alt="${anime.title}" />
                        <div class="anime-info">
                            <span class="anime-title">${anime.title}</span>
                            <span class="anime-score">⭐ ${anime.score ?? 'N/A'}</span>
                            <span class="anime-score">Эпизодов: ${anime.episodes ?? '?'}</span>
                        </div>
                    `;
                    list.appendChild(card);
                });

            } catch (error) {
                loading.textContent = 'Ошибка загрузки 😢';
                console.error(error);
            }
        }

        document.querySelectorAll('button[data-target]').forEach(button => {
            button.addEventListener('click', event => {
                const target = button.dataset.target;
                document.querySelectorAll('.tab').forEach(tab => {
                    tab.classList.toggle('active', tab.id == target);
                });

                if (target === 'tab3') {
                    fetchAnime();
                }
            });
        });

        document.getElementById('refresh-btn').addEventListener('click', fetchAnime);
    </script>
</body>

</html>
