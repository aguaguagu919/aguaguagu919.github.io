<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .tab.active {
            display: block;
        }

        .tab {
            display: none;
        }

        .button-container {
            font-size: 20px;
            width: 120px;
            height: 40px;
            text-align: center;
            margin-bottom: 50px;
            border-radius: 10px;
            background-color: rgb(186, 163, 232);
            transition: background-color 0.5s;
        }

        .button-container:hover {
            background-color: rgb(215, 203, 239);
        }

        nav {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 40px;
            max-width: 30ch;

        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: rgb(144, 177, 255);

        }
        .tab1{
            tex
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <button class="button-container" data-target="tab1">Я</button>
            <button class="button-container" data-target="tab2">О мне</button>
            <button class="button-container" data-target="tab3">Что то </button>
        </nav>
    </header>

    <div class="tabs-container">
        <div id="tab1" class="tab active">
            <div class="cell">
                <h2>Меня зовут Руслан, я студент второго курса информационных технологий</h2>
            </div>
        </div>

        <div id="tab2" class="tab">
            <div class="cell">
                <h2>Я учусь в колледже ItHub</h2>
            </div>
        </div>

        <div id="tab3" class="tab">
            <div class="cell">
                <h2>ВСЕ</h2>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('button[data-target]').forEach(button => {
            button.addEventListener('click', event => {
                document.querySelectorAll('.tab').forEach(tab => {
                    console.log([tab.id, button.dataset.target])
                    tab.classList.toggle('active', tab.id == button.dataset.target);
                })
            })
        })
    </script>
</body>

</html>
